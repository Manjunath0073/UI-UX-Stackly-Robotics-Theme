<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STACKLY — Establish Access</title>
<style>
  :root {
    --navy: #0B1420;
    --bg: #06090e;
    --slate: #8a93a6;
    --slate-dim: #5b6472;
    --white: #e8eef2;
    --cyan: #5CE1E6;
    --cyan-dim: rgba(92, 225, 230, 0.12);
    --border: rgba(138, 147, 166, 0.18);
    --border-strong: rgba(138, 147, 166, 0.32);
    --mono: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', 'IBM Plex Mono', 'Share Tech Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--white);
    overflow-x: hidden;
  }

  .auth {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Left: hero media ---------- */
  .auth-media {
    position: relative;
    width: 45%;
    min-height: 100vh;
    overflow: hidden;
    flex-shrink: 0;
  }

  .auth-media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .media-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(6, 10, 16, 0) 48%, rgba(6, 10, 16, 0.28) 78%, rgba(22, 56, 64, 0.42) 100%),
      linear-gradient(90deg, rgba(6, 10, 16, 0.55), rgba(6, 10, 16, 0) 55%);
  }

  .embers {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .ember {
    position: absolute;
    bottom: -12px;
    border-radius: 50%;
    background: #ff9b45;
    box-shadow: 0 0 6px #ff9b45, 0 0 14px rgba(255, 155, 69, 0.55);
    animation: emberRise linear infinite;
  }

  .ember:nth-child(1) { left: 8%;  width: 3px;  height: 3px;  animation-duration: 9s;  animation-delay: 0s; }
  .ember:nth-child(2) { left: 17%; width: 2px;  height: 2px;  animation-duration: 12s; animation-delay: 2.5s; }
  .ember:nth-child(3) { left: 26%; width: 4px;  height: 4px;  animation-duration: 10s; animation-delay: 5s; }
  .ember:nth-child(4) { left: 38%; width: 2px;  height: 2px;  animation-duration: 14s; animation-delay: 1s; }
  .ember:nth-child(5) { left: 52%; width: 3px;  height: 3px;  animation-duration: 11s; animation-delay: 6.5s; }
  .ember:nth-child(6) { left: 63%; width: 2px;  height: 2px;  animation-duration: 13s; animation-delay: 3.5s; }
  .ember:nth-child(7) { left: 74%; width: 3px;  height: 3px;  animation-duration: 9.5s; animation-delay: 8s; }
  .ember:nth-child(8) { left: 86%; width: 2px;  height: 2px;  animation-duration: 12.5s; animation-delay: 4s; }
  .ember:nth-child(9) { left: 93%; width: 3px;  height: 3px;  animation-duration: 10.5s; animation-delay: 1.8s; }

  @keyframes emberRise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.9; }
    55%  { opacity: 0.6; }
    100% { transform: translateY(-105vh) translateX(12px); opacity: 0; }
  }

  .media-tag {
    position: absolute;
    left: 28px;
    top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-family: var(--mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 11px;
    color: rgba(232, 238, 242, 0.85);
    z-index: 2;
  }

  .media-tag .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px #fff, 0 0 16px rgba(255, 255, 255, 0.5);
    animation: dotPulse 2.2s ease-in-out infinite;
  }

  .seq-panel {
    position: absolute;
    left: 28px;
    bottom: 28px;
    z-index: 2;
    max-width: 300px;
    padding: 18px 20px;
    border-radius: 12px;
    background: rgba(8, 13, 20, 0.72);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
  }

  .seq-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .seq-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    color: var(--cyan);
    flex-shrink: 0;
  }

  .seq-title {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--white);
  }

  .seq-text {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.03em;
    color: rgba(138, 147, 166, 0.7);
  }

  /* ---------- Right: interface panel ---------- */
  .auth-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 40px;
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(92, 225, 230, 0.05), transparent 70%),
      var(--navy);
  }

  .auth-card {
    width: min(440px, 100%);
    padding: 44px 40px;
    border-radius: 18px;
    background: rgba(10, 17, 26, 0.72);
    border: 1px solid var(--border);
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.5),
      0 0 40px rgba(92, 225, 230, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 10px rgba(92, 225, 230, 0.35));
  }

  .brand-wordmark {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--white);
  }

  .brand-logo {
    display: inline-flex;
    margin-bottom: 16px;
  }

  .brand-logo img {
    height: 36px;
    width: auto;
    filter: brightness(0) saturate(100%) invert(1);
  }

  .go-home {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 60;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: rgba(10, 17, 26, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--slate);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  }

  .go-home svg {
    color: var(--cyan);
  }

  .go-home:hover {
    border-color: var(--cyan);
    color: var(--white);
    background: rgba(92, 225, 230, 0.08);
  }

  .heading {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: var(--white);
    text-align: center;
  }

  .subheading {
    margin-top: 8px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--slate);
    text-align: center;
  }

  .form {
    margin-top: 32px;
  }

  .field {
    display: block;
    margin-bottom: 22px;
  }

  .field-label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 10px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: rgba(6, 9, 14, 0.6);
    color: var(--white);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-wrap input::placeholder {
    color: var(--slate-dim);
  }

  .input-wrap input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(92, 225, 230, 0.12), 0 0 18px rgba(92, 225, 230, 0.12);
  }

  .input-wrap input[type="password"] {
    padding-right: 46px;
  }

  .eye {
    position: absolute;
    right: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--slate-dim);
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .eye:hover {
    color: var(--cyan);
  }

  /* ---------- Role selector ---------- */
  .role-group {
    display: block;
    margin-bottom: 22px;
  }

  .role-head {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 10px;
  }

  .role-row {
    display: flex;
    gap: 10px;
  }

  .role {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: rgba(6, 9, 14, 0.4);
    color: var(--slate);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }

  .role svg {
    color: var(--slate-dim);
  }

  .role:hover {
    border-color: var(--cyan);
    color: var(--white);
  }

  .role.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
    box-shadow: 0 0 16px rgba(92, 225, 230, 0.15);
  }

  .role.active svg {
    color: var(--cyan);
  }

  .consent {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 22px;
    cursor: pointer;
  }

  .consent input {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    margin-top: 2px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: rgba(6, 9, 14, 0.6);
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }

  .consent input:checked {
    border-color: var(--cyan);
    background: var(--cyan);
  }

  .consent input:checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #0a0e14;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .consent span {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    color: var(--slate);
  }

  .btn-create {
    width: 100%;
    padding: 15px 20px;
    border-radius: 10px;
    border: 1px solid var(--cyan);
    background: transparent;
    color: var(--cyan);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-create:hover {
    background: var(--cyan-dim);
    box-shadow: 0 0 22px rgba(92, 225, 230, 0.22);
  }

  .btn-create:disabled {
    opacity: 0.7;
    cursor: progress;
  }

  .auth-footer {
    margin-top: 26px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--slate);
  }

  .auth-footer a {
    color: var(--white);
    text-decoration: underline;
    text-underline-offset: 4px;
    letter-spacing: 0.12em;
    transition: color 0.2s ease;
  }

  .auth-footer a:hover {
    color: var(--cyan);
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .auth {
      flex-direction: column;
    }

    .auth-media {
      width: 100%;
      min-height: 32vh;
      max-height: 36vh;
    }

    .auth-panel {
      padding: clamp(24px, 5vw, 40px) clamp(16px, 5vw, 20px);
    }

    .auth-card {
      width: 100%;
      padding: clamp(24px, 5vw, 36px) clamp(16px, 5vw, 28px);
    }

    .seq-panel {
      left: 16px;
      right: 16px;
      max-width: none;
      padding: 14px 16px;
    }

    .seq-title {
      font-size: 13px;
    }

    .seq-text {
      font-size: 10px;
    }
  }

  @media (max-width: 640px) {
    .role-row {
      flex-direction: column;
    }

    .role {
      width: 100%;
      justify-content: center;
    }

    .brand-wordmark {
      font-size: clamp(22px, 7vw, 30px);
    }

    .heading {
      font-size: clamp(22px, 6vw, 26px);
    }

    .subheading {
      font-size: 13px;
    }

    .input-wrap input {
      padding: 14px 16px;
      font-size: 16px;
    }

    .input-wrap input[type="password"] {
      padding-right: 44px;
    }

    .btn-create {
      min-height: 48px;
    }

    .consent span {
      font-size: 10px;
    }
  }

  @media (max-width: 480px) {
    .auth-media {
      min-height: 26vh;
      max-height: 30vh;
    }

    .seq-panel {
      left: 12px;
      right: 12px;
      bottom: 12px;
    }

    .media-tag {
      left: 16px;
      top: 16px;
      font-size: 10px;
    }

    .auth-footer {
      font-size: 10px;
    }

    .auth-footer a {
      font-size: 11px;
    }
  }

  @media (max-width: 360px) {
    .auth-card {
      padding: 20px 14px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
    }

    .input-wrap input {
      padding: 12px 14px;
      font-size: 15px;
    }

    .btn-create {
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    .role {
      padding: 10px 12px;
      font-size: 11px;
    }
  }
</style>
</head>
<body>
  <a href="index.html" class="go-home" aria-label="Go Home">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>
    Go Home
  </a>
  <main class="auth">

    <div class="auth-media">
      <img src="assets/images/auth/login-signup-img.webp" alt="STACKLY android operator profile">
      <div class="media-overlay" aria-hidden="true"></div>
      <div class="embers" aria-hidden="true">
        <span class="ember"></span>
        <span class="ember"></span>
        <span class="ember"></span>
        <span class="ember"></span>
        <span class="ember"></span>
        <span class="ember"></span>
        <span class="ember"></span>
        <span class="ember"></span>
        <span class="ember"></span>
      </div>
      <div class="media-tag">
        <span class="dot" aria-hidden="true"></span>
        Secure Connection
      </div>
      <div class="seq-panel">
        <div class="seq-head">
          <span class="seq-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
          </span>
          <span class="seq-title">Initialize Sequence</span>
        </div>
        <p class="seq-text">Connecting to AETERNUS core systems. Secure access protocol engaged.</p>
      </div>
    </div>

    <div class="auth-panel">
      <div class="auth-card">
        <div class="brand">
          <a href="index.html" class="brand-logo" aria-label="Stackly Home">
            <img src="assets/images/home/nav-logo.webp" alt="STACKLY">
          </a>
        </div>

        <h2 class="heading">Establish Access</h2>
        <p class="subheading">Register new operator credentials.</p>

        <form class="form" id="signupForm" novalidate>
          <div class="role-group">
            <span class="role-head">Operator Class</span>
            <div class="role-row" id="roleRow">
              <button type="button" class="role active" data-role="operator" aria-pressed="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 21v-1a7 7 0 0 1 14 0v1"/>
                </svg>
                Operator
              </button>
              <button type="button" class="role" data-role="admin" aria-pressed="false">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5l8-3z"/>
                  <path d="M8.5 12l2.5 2.5 4.5-5"/>
                </svg>
                Administrator
              </button>
            </div>
          </div>

          <label class="field">
            <span class="field-label">Full Name</span>
            <div class="input-wrap">
              <input type="text" id="fullName" placeholder="Operator Designation" autocomplete="name">
            </div>
          </label>

          <label class="field">
            <span class="field-label">Business Email</span>
            <div class="input-wrap">
              <input type="email" id="email" placeholder="operator@domain.com" autocomplete="email">
            </div>
          </label>

          <label class="field">
            <span class="field-label">Security Key</span>
            <div class="input-wrap">
              <input type="password" id="password" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" autocomplete="new-password">
              <button type="button" class="eye" id="togglePwd" aria-label="Show or hide password">
                <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                  <path d="M1 1l22 22"/>
                </svg>
              </button>
            </div>
          </label>

          <label class="consent">
            <input type="checkbox" id="consent">
            <span>I acknowledge the System Protocols and Security Directives.</span>
          </label>

          <button type="submit" class="btn-create" id="createBtn">Create Account &#8594;</button>
        </form>

        <p class="auth-footer">
          Existing operator? <a href="login.html">Initiate Login</a>
        </p>
      </div>
    </div>

  </main>

  <script>
    (function () {
      var toggle = document.getElementById('togglePwd');
      var password = document.getElementById('password');
      var eyeOpen = document.getElementById('eyeOpen');
      var eyeClosed = document.getElementById('eyeClosed');
      var form = document.getElementById('signupForm');
      var createBtn = document.getElementById('createBtn');
      var consent = document.getElementById('consent');
      var roleRow = document.getElementById('roleRow');

      if (roleRow) {
        roleRow.addEventListener('click', function (e) {
          var role = e.target.closest('.role');
          if (!role) return;
          roleRow.querySelectorAll('.role').forEach(function (r) {
            r.classList.remove('active');
            r.setAttribute('aria-pressed', 'false');
          });
          role.classList.add('active');
          role.setAttribute('aria-pressed', 'true');
        });
      }

      if (toggle && password) {
        toggle.addEventListener('click', function () {
          var show = password.type === 'password';
          password.type = show ? 'text' : 'password';
          eyeOpen.style.display = show ? 'none' : 'inline';
          eyeClosed.style.display = show ? 'inline' : 'none';
        });
      }

      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (consent && !consent.checked) {
            consent.style.borderColor = '#ff3b30';
            return;
          }
          if (consent) {
            consent.style.borderColor = '';
          }
          var original = createBtn.innerHTML;
          createBtn.disabled = true;
          createBtn.textContent = 'Registering...';

          var fullNameVal = document.getElementById('fullName').value.trim();
          var emailVal = document.getElementById('email').value.trim();
          var activeRole = roleRow.querySelector('.role.active');
          var roleVal = activeRole ? activeRole.getAttribute('data-role') : 'operator';
          var mappedRole = roleVal === 'admin' ? 'Administrator' : 'Operator';

          var user = {
            fullName: fullNameVal || 'Operator',
            email: emailVal || 'operator@stackly.com',
            role: mappedRole
          };

          localStorage.setItem('user', JSON.stringify(user));

          setTimeout(function () {
            createBtn.disabled = false;
            createBtn.innerHTML = original;
            if (mappedRole === 'Administrator') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'operator-dashboard.html';
            }
          }, 1400);
        });
      }
    })();
  </script>
</body>
</html>
