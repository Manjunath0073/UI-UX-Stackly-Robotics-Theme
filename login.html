<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STACKLY — System Access Terminal</title>
<style>
  :root {
    --navy: #0B1420;
    --bg: #06090e;
    --slate: #8a93a6;
    --slate-dim: #5b6472;
    --white: #e8eef2;
    --cyan: #5CE1E6;
    --cyan-dim: rgba(92, 225, 230, 0.12);
    --border: rgba(138, 147, 166, 0.18);
    --border-strong: rgba(138, 147, 166, 0.32);
    --mono: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', 'IBM Plex Mono', 'Share Tech Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--white);
    overflow-x: hidden;
  }

  .auth {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Left: hero media ---------- */
  .auth-media {
    position: relative;
    width: 45%;
    min-height: 100vh;
    overflow: hidden;
    flex-shrink: 0;
  }

  .auth-media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .media-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(6, 10, 16, 0) 48%, rgba(6, 10, 16, 0.28) 78%, rgba(22, 56, 64, 0.42) 100%),
      linear-gradient(90deg, rgba(6, 10, 16, 0.55), rgba(6, 10, 16, 0) 55%);
  }

  .embers {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .ember {
    position: absolute;
    bottom: -12px;
    border-radius: 50%;
    background: #ff9b45;
    box-shadow: 0 0 6px #ff9b45, 0 0 14px rgba(255, 155, 69, 0.55);
    animation: emberRise linear infinite;
  }

  .ember:nth-child(1) { left: 8%;  width: 3px;  height: 3px;  animation-duration: 9s;  animation-delay: 0s; }
  .ember:nth-child(2) { left: 17%; width: 2px;  height: 2px;  animation-duration: 12s; animation-delay: 2.5s; }
  .ember:nth-child(3) { left: 26%; width: 4px;  height: 4px;  animation-duration: 10s; animation-delay: 5s; }
  .ember:nth-child(4) { left: 38%; width: 2px;  height: 2px;  animation-duration: 14s; animation-delay: 1s; }
  .ember:nth-child(5) { left: 52%; width: 3px;  height: 3px;  animation-duration: 11s; animation-delay: 6.5s; }
  .ember:nth-child(6) { left: 63%; width: 2px;  height: 2px;  animation-duration: 13s; animation-delay: 3.5s; }
  .ember:nth-child(7) { left: 74%; width: 3px;  height: 3px;  animation-duration: 9.5s; animation-delay: 8s; }
  .ember:nth-child(8) { left: 86%; width: 2px;  height: 2px;  animation-duration: 12.5s; animation-delay: 4s; }
  .ember:nth-child(9) { left: 93%; width: 3px;  height: 3px;  animation-duration: 10.5s; animation-delay: 1.8s; }

  @keyframes emberRise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.9; }
    55%  { opacity: 0.6; }
    100% { transform: translateY(-105vh) translateX(12px); opacity: 0; }
  }

  .media-tag {
    position: absolute;
    left: 28px;
    font-family: var(--mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 11px;
    z-index: 2;
  }

  .media-tag.top {
    top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: rgba(232, 238, 242, 0.85);
  }

  .media-tag.top .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px #fff, 0 0 16px rgba(255, 255, 255, 0.5);
    animation: dotPulse 2.2s ease-in-out infinite;
  }

  .media-tag.bottom {
    bottom: 28px;
    color: rgba(232, 238, 242, 0.5);
    line-height: 2;
    font-size: 10px;
  }

  .media-tag.bottom span {
    color: var(--cyan);
    opacity: 0.85;
  }

  /* ---------- Right: interface panel ---------- */
  .auth-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 40px;
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(92, 225, 230, 0.05), transparent 70%),
      var(--navy);
  }

  .auth-card {
    width: min(420px, 100%);
    padding: 44px 40px;
    border-radius: 18px;
    background: rgba(10, 17, 26, 0.72);
    border: 1px solid var(--border);
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.5),
      0 0 40px rgba(92, 225, 230, 0.04),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    margin-bottom: 14px;
    filter: drop-shadow(0 0 10px rgba(92, 225, 230, 0.35));
  }

  .brand-wordmark {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--white);
  }

  .brand-subtitle {
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--slate);
  }

  .brand-logo {
    display: inline-flex;
    margin-bottom: 16px;
  }

  .brand-logo img {
    height: 36px;
    width: auto;
    filter: brightness(0) saturate(100%) invert(1);
  }

  .go-home {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 60;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: rgba(10, 17, 26, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--slate);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  }

  .go-home svg {
    color: var(--cyan);
  }

  .go-home:hover {
    border-color: var(--cyan);
    color: var(--white);
    background: rgba(92, 225, 230, 0.08);
  }

  /* ---------- Fields ---------- */
  .field {
    display: block;
    margin-bottom: 22px;
  }

  .field-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .field-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
  }

  .recover {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--cyan);
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .recover:hover {
    opacity: 0.75;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap svg.icon {
    position: absolute;
    left: 16px;
    z-index: 1;
    color: var(--slate-dim);
    pointer-events: none;
  }

  .input-wrap input {
    width: 100%;
    padding: 14px 46px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: rgba(6, 9, 14, 0.6);
    color: var(--white);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-wrap input::placeholder {
    color: var(--slate-dim);
  }

  .input-wrap input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(92, 225, 230, 0.12), 0 0 18px rgba(92, 225, 230, 0.12);
  }

  .eye {
    position: absolute;
    right: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--slate-dim);
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .eye:hover {
    color: var(--cyan);
  }

  /* ---------- Role selector ---------- */
  .role-group {
    display: block;
    margin-bottom: 22px;
  }

  .role-head {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 10px;
  }

  .role-row {
    display: flex;
    gap: 10px;
  }

  .role {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: rgba(6, 9, 14, 0.4);
    color: var(--slate);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }

  .role svg {
    color: var(--slate-dim);
  }

  .role:hover {
    border-color: var(--cyan);
    color: var(--white);
  }

  .role.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
    box-shadow: 0 0 16px rgba(92, 225, 230, 0.15);
  }

  .role.active svg {
    color: var(--cyan);
  }

  /* ---------- Buttons ---------- */
  .btn-login {
    width: 100%;
    margin-top: 8px;
    padding: 15px 20px;
    border-radius: 10px;
    border: 1px solid var(--cyan);
    background: transparent;
    color: var(--cyan);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-login:hover {
    background: var(--cyan-dim);
    box-shadow: 0 0 22px rgba(92, 225, 230, 0.22);
  }

  .btn-login:disabled {
    opacity: 0.7;
    cursor: progress;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 26px 0;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--slate-dim);
    white-space: nowrap;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
  }

  .social {
    display: flex;
    gap: 12px;
  }

  .social-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 9999px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--slate);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  }

  .social-btn:hover {
    border-color: var(--cyan);
    color: var(--white);
    background: rgba(92, 225, 230, 0.06);
  }

  .auth-footer {
    margin-top: 30px;
    text-align: center;
  }

  .auth-footer p {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--slate-dim);
    margin-bottom: 10px;
  }

  .auth-footer a {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--slate);
    text-decoration: underline;
    text-underline-offset: 4px;
    transition: color 0.2s ease;
  }

  .auth-footer a:hover {
    color: var(--cyan);
  }

  .form-error {
    display: none;
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(255, 59, 48, 0.12);
    border: 1px solid rgba(255, 59, 48, 0.5);
    color: #ff7b72;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  .form-error.show {
    display: block;
  }

  .field.has-error .input-wrap input {
    border-color: #ff3b30;
    box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.12);
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .auth {
      flex-direction: column;
    }

    .auth-media {
      width: 100%;
      min-height: 34vh;
      max-height: 38vh;
    }

    .auth-panel {
      padding: clamp(24px, 5vw, 40px) clamp(16px, 5vw, 20px);
    }

    .auth-card {
      width: 100%;
      padding: clamp(24px, 5vw, 36px) clamp(16px, 5vw, 28px);
    }
  }

  @media (max-width: 640px) {
    .role-row {
      flex-direction: column;
    }

    .role {
      width: 100%;
      justify-content: center;
    }

    .field-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .brand-wordmark {
      font-size: clamp(22px, 7vw, 30px);
    }

    .brand-subtitle {
      font-size: 10px;
    }

    .input-wrap input {
      padding: 14px 44px;
      font-size: 16px;
    }

    .btn-login,
    .social-btn {
      min-height: 48px;
    }
  }

  @media (max-width: 480px) {
    .auth-media {
      min-height: 28vh;
      max-height: 32vh;
    }

    .social {
      flex-direction: column;
    }

    .media-tag.top {
      left: 16px;
      top: 16px;
      font-size: 10px;
    }

    .media-tag.bottom {
      left: 16px;
      bottom: 16px;
      font-size: 9px;
    }

    .auth-footer a,
    .auth-footer p {
      font-size: 10px;
    }
  }

  @media (max-width: 360px) {
    .auth-card {
      padding: 20px 14px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
    }

    .input-wrap input {
      padding: 12px 40px;
      font-size: 15px;
    }

    .btn-login {
      font-size: 12px;
      letter-spacing: 0.12em;
    }
  }
</style>
</head>

          <button type="button" class="social-btn" onclick="window.location.href='404.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/>

        <div class="auth-footer">
          <p>Authorized Personnel Only.</p>
          <a href="signup.html">Request Access</a>
        </div>
      </div>
    </div>

  </main>

  <script>
    (function () {
      var toggle = document.getElementById('togglePwd');
      var password = document.getElementById('password');
      var eyeOpen = document.getElementById('eyeOpen');
      var eyeClosed = document.getElementById('eyeClosed');
      var form = document.getElementById('loginForm');
      var loginBtn = document.getElementById('loginBtn');
      var roleRow = document.getElementById('roleRow');

      if (roleRow) {
        roleRow.addEventListener('click', function (e) {
          var role = e.target.closest('.role');
          if (!role) return;
          roleRow.querySelectorAll('.role').forEach(function (r) {
            r.classList.remove('active');
            r.setAttribute('aria-pressed', 'false');
          });
          role.classList.add('active');
          role.setAttribute('aria-pressed', 'true');
        });
      }

      if (toggle && password) {
        toggle.addEventListener('click', function () {
          var show = password.type === 'password';
          password.type = show ? 'text' : 'password';
          eyeOpen.style.display = show ? 'none' : 'inline';
          eyeClosed.style.display = show ? 'inline' : 'none';
        });
      }

      if (form) {
        var error = document.getElementById('loginError');

        function showError(msg) {
          error.textContent = msg;
          error.classList.add('show');
          clearTimeout(showError._t);
          showError._t = setTimeout(function () {
            error.classList.remove('show');
          }, 3000);
        }

        function clearErrors() {
          form.querySelectorAll('.field').forEach(function (el) {
            el.classList.remove('has-error');
          });
        }

        var emailInput = document.getElementById('email');
        var passInput = document.getElementById('password');

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var emailVal = emailInput.value.trim();
          var passVal = passInput.value;

          clearErrors();

          if (!emailVal) {
            showError('Operator ID / Email is required.');
            emailInput.closest('.field').classList.add('has-error');
            emailInput.focus();
            return;
          }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
            showError('Please enter a valid email address.');
            emailInput.closest('.field').classList.add('has-error');
            emailInput.focus();
            return;
          }
          if (!passVal) {
            showError('Security key is required.');
            passInput.closest('.field').classList.add('has-error');
            passInput.focus();
            return;
          }
          if (passVal.length < 8) {
            showError('Security key must be at least 8 characters.');
            passInput.closest('.field').classList.add('has-error');
            passInput.focus();
            return;
          }

          var original = loginBtn.innerHTML;
          loginBtn.disabled = true;
          loginBtn.textContent = 'Authenticating...';

          var activeRole = roleRow.querySelector('.role.active');
          var roleVal = activeRole ? activeRole.getAttribute('data-role') : 'operator';
          var mappedRole = roleVal === 'admin' ? 'Administrator' : 'Operator';

          var user = {
            fullName: emailVal ? emailVal.split('@')[0].replace(/[^a-zA-Z ]/g, '') : 'Operator',
            email: emailVal,
            role: mappedRole
          };

          localStorage.setItem('user', JSON.stringify(user));

          setTimeout(function () {
            loginBtn.disabled = false;
            loginBtn.innerHTML = original;
            if (mappedRole === 'Administrator') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'operator-dashboard.html';
            }
          }, 1400);
        });

        [emailInput, passInput].forEach(function (field) {
          field.addEventListener('input', function () {
            if (field.closest('.field')) field.closest('.field').classList.remove('has-error');
          });
        });
      }
    })();
  </script>
</body>
</html>
